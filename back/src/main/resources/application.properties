spring.application.name=bolsines
server.port=8080

# Base H2 en modo archivo dentro de back/data (no hace falta instalar nada).
spring.datasource.url=jdbc:h2:file:./data/bolsines
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea las tablas a partir de las entidades en cada arranque y despues se carga
# data.sql con los datos de prueba. Asi cada demo empieza siempre desde el mismo estado.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Consola para ver las tablas: http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:file:./data/bolsines, usuario sa, sin contrasena)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Lectura de data.sql con tildes
spring.sql.init.encoding=UTF-8
